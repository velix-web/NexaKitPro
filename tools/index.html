<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Direktori semua tools NexaKit Pro."><link rel="canonical" href="https://nexakitpro.my.id/tools/"><meta property="og:title" content="Tools — NexaKit Pro"><meta property="og:description" content="Cari downloader, creator, image tools, dan utility NexaKit Pro."><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/assets/css/global.css"><title>Tools — NexaKit Pro</title></head><body class="directory-page"><main class="directory-shell"><header class="site-header"><a class="brand" href="/">NexaKit Pro</a><nav class="site-nav"><a href="/">Home</a><a href="/tools/" aria-current="page">Tools</a><a href="#filters">Categories</a></nav><button class="icon-btn" id="theme-toggle" type="button"><svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg></button></header><section class="directory-hero">
  <div>
    <span class="eyebrow">TOOL DIRECTORY</span>
    <h1>Everything you need,<br>in one place.</h1>
    <p>Cari tool yang kamu butuhkan lalu masuk ke workspace khusus. Directory untuk menemukan; workspace untuk mengerjakan.</p>
  </div>
  <div class="directory-count"><strong id="tool-count">20</strong><span>tools available</span></div>
</section><div class="directory-controls">
  <label class="search-field" for="tool-search"><span aria-hidden="true">⌕</span><input class="search-input" id="tool-search" type="search" placeholder="Search tools…" autocomplete="off"></label>
  <div class="filter-row" id="filters"></div>
</div><section class="tool-grid" id="tool-grid"></section><footer class="site-footer">NexaKit Pro · by Shakz ✓ · PWA Ready</footer></main><nav class="mobile-nav"><a href="/">Home</a><a href="/tools/">Tools</a><a href="#" id="mobile-theme">Theme</a></nav><script src="/assets/js/registry.js"></script><script src="/assets/js/core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{initCore();document.getElementById('theme-toggle').addEventListener('click',toggleTheme);document.getElementById('mobile-theme').addEventListener('click',e=>{e.preventDefault();toggleTheme()});let cat='all';const search=document.getElementById('tool-search'),grid=document.getElementById('tool-grid'),filters=document.getElementById('filters');const cats=[['all','All'],['downloader','Downloader'],['maker','Creator'],['tools','Image / Utility']];filters.innerHTML=cats.map(([v,l])=>`<button class="filter-btn ${v==='all'?'active':''}" data-cat="${v}" type="button">${l}</button>`).join('');function render(){const q=search.value.toLowerCase().trim();const items=TOOLS.filter(t=>(cat==='all'||t.category===cat)&&(!q||`${t.name} ${t.title} ${t.description}`.toLowerCase().includes(q)));grid.innerHTML=items.length?items.map(t=>`<a class="tool-card" href="${t.path}" data-cat="${t.category}">
<span class="tool-card-icon" aria-hidden="true">${icon(t.category==='downloader'?'download':t.category==='maker'?'sparkle':'image')}</span>
<span class="tool-tag">${t.category==='maker'?'CREATOR':t.category==='tools'?'UTILITY':'DOWNLOADER'}</span>
<div class="tool-card-title"><h2>${escapeHtml(t.title)}</h2><span class="tool-card-arrow" aria-hidden="true">→</span></div>
<p>${escapeHtml(t.description)}</p>
</a>`).join(''):'<div class="home-empty">Tool tidak ditemukan.</div>';document.getElementById('tool-count').textContent=items.length;}filters.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;filters.querySelectorAll('.filter-btn').forEach(x=>x.classList.toggle('active',x===b));render();});search.addEventListener('input',render);render();});</script></body></html>
