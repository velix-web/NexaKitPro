<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman Tidak Ditemukan — NexaKit Pro</title>
<meta name="description" content="Halaman yang kamu cari tidak ditemukan di NexaKit Pro.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>(function(){try{var t=localStorage.getItem('nexakit-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="/styles.css">
<style>
.error-screen{min-height:100vh;display:grid;place-items:center;padding:28px 18px;text-align:center}
.error-card{width:min(460px,100%);padding:36px 28px;border-radius:var(--r-xl);background:var(--surface);
border:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.error-card .fa{font-size:40px;color:var(--accent);margin-bottom:14px}
.error-card h1{margin:0 0 6px;font-size:clamp(30px,7vw,44px);font-weight:800;letter-spacing:-1.2px}
.error-card p{margin:0 0 22px;color:var(--muted)}
.error-card a{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;
border-radius:var(--r-md);font-weight:700;color:var(--on-accent);background:var(--accent);box-shadow:0 8px 20px var(--glow);
text-decoration:none}
</style>
</head>
<body>
<div class="error-screen">
  <div class="error-card">
    <i class="fa fa-compass" aria-hidden="true"></i>
    <h1>404</h1>
    <p>Halaman yang kamu cari tidak ada atau sudah dipindahkan.</p>
    <a href="/"><i class="fa fa-arrow-left" aria-hidden="true"></i> Kembali ke NexaKit Pro</a>
  </div>
</div>
</body>
</html>
