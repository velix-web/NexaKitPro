<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaKit Pro - Fitur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-alt:#fafafa;
    --bg-page:#f2f3f5;
    --text:#161616;
    --text-sub:#6b7280;
    --text-faint:#9ca3af;
    --border:#e5e7eb;
    --border-strong:#d1d5db;
    --accent:#2454e0;
    --accent-hover:#1c42b8;
    --accent-soft:#eef2ff;
    --accent-bright:#dc2626;
    --success:#15803d;
    --radius:10px;
    --radius-sm:7px;
    --shadow-sm:0 1px 2px rgba(16,24,40,.05);
    --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:'Sora',var(--font);
    /* motion: expo-out for entrances/exits, spring for playful taps */
    --ease:cubic-bezier(.16,1,.3,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --dur-fast:.15s;
    --dur:.25s;
    --dur-slow:.35s;
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;}
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 64px calc(16px + env(safe-area-inset-left));
    transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .shell{max-width:480px;margin:0 auto;transition:background var(--dur) var(--ease);}

  @media (min-width:680px){
    body{
      background:var(--bg-page);
      display:flex;justify-content:center;
      padding:48px 24px;
    }
    .shell{
      background:var(--bg);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:0 24px 60px -20px rgba(16,24,40,.18);
      padding:28px 28px 36px;
      width:100%;
    }
  }
  @media (min-width:1024px){
    .shell{max-width:520px;padding:32px 32px 40px;}
  }

  /* header */
  .site-header{padding:8px 2px 20px;}
  .header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .header-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;padding-top:1px;}
  .icon-btn{
    width:42px;height:42px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);border-radius:50%;
    background:var(--bg);color:var(--text-sub);cursor:pointer;
    transition:border-color var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease),
               background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-spring);
  }
  .icon-btn svg{width:18px;height:18px;transition:transform var(--dur) var(--ease);}
  .icon-btn:hover{border-color:var(--text-faint);color:var(--text);}
  .icon-btn:active{transform:scale(.9);}
  #theme-toggle:active svg{transform:rotate(50deg);}

  /* dark mode: same tokens, new values -- everything below already reads var(--*) */
  body.dark-mode{
    --bg:#101114;
    --bg-alt:#1a1c21;
    --bg-page:#000000;
    --text:#f2f3f5;
    --text-sub:#9ca0ab;
    --text-faint:#6b7078;
    --border:#292b31;
    --border-strong:#3a3d45;
    --accent:#5b8cfd;
    --accent-hover:#7ba3ff;
    --accent-soft:#182644;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  }

  /* overlay behind side menu / feedback sheet */
  .overlay{
    position:fixed;inset:0;background:rgba(10,10,14,.5);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease);z-index:60;
  }
  .overlay.active{opacity:1;pointer-events:auto;}

  /* burger drawer */
  .side-menu{
    position:fixed;top:0;right:0;bottom:0;width:min(320px,86%);
    background:var(--bg);border-left:1px solid var(--border);
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    overflow-y:auto;z-index:70;
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease);
    box-shadow:-10px 0 28px rgba(0,0,0,.12);
  }
  .side-menu.open{transform:translateX(0);}
  .side-menu-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .side-menu-title{font-family:var(--font-display);font-weight:700;font-size:16px;}

  .menu-section{margin-bottom:22px;}
  .menu-section:last-child{margin-bottom:0;}
  .menu-section-label{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text-faint);margin-bottom:10px;text-transform:uppercase;}

  /* items animate in only once the drawer is actually open, staggered for a lively feel */
  .dev-card,.menu-item{opacity:0;}
  .side-menu.open .dev-card,.side-menu.open .menu-item{
    animation:menuItemIn var(--dur-slow) var(--ease-spring) both;
  }
  .side-menu.open .menu-item:nth-of-type(1){animation-delay:.04s;}
  .side-menu.open .menu-item:nth-of-type(2){animation-delay:.09s;}
  .side-menu.open .menu-item:nth-of-type(3){animation-delay:.14s;}
  @keyframes menuItemIn{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:translateX(0);}}

  .dev-card{
    display:flex;align-items:center;gap:12px;
    background:var(--bg-alt);border:1px solid var(--border);
    border-radius:var(--radius);padding:12px;
    transition:border-color var(--dur-fast) var(--ease);
  }
  .dev-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
  .dev-name{font-family:var(--font-display);font-weight:700;font-size:14.5px;}
  .dev-role{font-size:12px;color:var(--text-sub);margin-top:1px;}

  .menu-item{
    width:100%;min-height:48px;display:flex;align-items:center;gap:12px;
    background:none;border:none;border-bottom:1px solid var(--border);
    padding:12px 4px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);
    cursor:pointer;text-align:left;border-radius:8px;
    transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-spring);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item-icon{width:19px;height:19px;flex-shrink:0;color:var(--text-sub);transition:color var(--dur-fast) var(--ease);}
  .menu-item .chev{margin-left:auto;color:var(--text-faint);width:16px;height:16px;flex-shrink:0;transition:transform var(--dur-fast) var(--ease);}
  .menu-item:hover{background:var(--bg-alt);color:var(--accent);padding-left:8px;}
  .menu-item:hover .menu-item-icon{color:var(--accent);}
  .menu-item:hover .chev{transform:translateX(2px);}
  .menu-item:active{transform:scale(.98);}

  /* feedback bottom sheet */
  .feedback-modal{
    position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;
    background:var(--bg);border:1px solid var(--border);border-bottom:none;
    border-top-left-radius:20px;border-top-right-radius:20px;
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));
    z-index:80;transform:translateY(100%);transition:transform var(--dur-slow) var(--ease), opacity var(--dur) var(--ease);
    box-shadow:0 -10px 28px rgba(0,0,0,.14);
    pointer-events:none;
  }
  .feedback-modal.open{transform:translateY(0);pointer-events:auto;}
  .sheet-handle{width:36px;height:4px;border-radius:99px;background:var(--border-strong);margin:0 auto 14px;}
  textarea{
    width:100%;font-family:inherit;font-size:14.5px;color:var(--text);
    background:var(--bg);border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);padding:11px 12px;outline:none;resize:vertical;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  textarea:hover{border-color:var(--text-faint);}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .brand-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .brand-name{
    font-family:var(--font-display);
    font-size:clamp(22px,5vw,27px);font-weight:800;letter-spacing:-.03em;margin:0;
    background:linear-gradient(100deg,var(--text) 45%,var(--accent) 120%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand-tagline{font-size:13px;color:var(--text-sub);margin:4px 0 0;font-style:italic;}

  /* generic field label */
  label{display:block;font-size:13px;font-weight:700;color:var(--text);margin:0 0 6px;letter-spacing:-.005em;}
  .field{margin-bottom:14px;}
  .field:last-child{margin-bottom:0;}
  /* helper text under a field: guides the user on expected format */
  .field-hint{font-size:11.5px;color:var(--text-faint);margin:6px 2px 0;line-height:1.4;}

  select,
  input[type="text"],
  input[type="number"],
  textarea,
  .tool-select-trigger{
    width:100%;
    font-family:inherit;
    font-size:14.5px;
    color:var(--text);
    background:var(--bg);
    border:1px solid var(--border-strong);
    border-radius:var(--radius-sm);
    padding:11px 12px;
    outline:none;
    transition:border-color .18s ease, box-shadow .18s ease;
  }
  @media (hover:hover) and (pointer:fine){
    select:hover,
    input[type="text"]:hover,
    input[type="number"]:hover{border-color:var(--text-faint);}
  }
  select:focus,
  input[type="text"]:focus,
  input[type="number"]:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  ::placeholder{color:var(--text-faint);}
  select{appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;cursor:pointer;
  }

  /* tool select block */
  .tool-picker{margin-bottom:16px;position:relative;}

  .tool-select-trigger{
    width:100%;display:flex;align-items:center;gap:10px;
    font-family:inherit;font-size:14.5px;color:var(--text);
    background:var(--bg);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    padding:11px 12px;cursor:pointer;text-align:left;
    transition:border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  }
  .tool-select-trigger:hover{border-color:var(--text-faint);}
  .tool-select-trigger[aria-expanded="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .tool-select-icon{width:19px;height:19px;flex-shrink:0;stroke:var(--accent);}
  .tool-select-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;}
  .tool-select-chev{width:16px;height:16px;flex-shrink:0;color:var(--text-faint);transition:transform var(--dur) var(--ease);}
  .tool-select-trigger[aria-expanded="true"] .tool-select-chev{transform:rotate(180deg);}

  .tool-select-panel{
    position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:40;
    background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:0 16px 40px -12px rgba(16,24,40,.22);
    max-height:min(360px,60vh);overflow-y:auto;padding:8px;
    opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top center;
    pointer-events:none;transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  }
  .tool-select-panel.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .tool-select-group-label{
    font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--text-faint);
    text-transform:uppercase;padding:10px 8px 6px;
  }
  .tool-select-group-label:first-child{padding-top:4px;}
  .tool-select-item{
    width:100%;display:flex;align-items:center;gap:10px;box-sizing:border-box;
    background:none;border:none;border-radius:8px;
    padding:12px 10px;min-height:44px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);
    cursor:pointer;text-align:left;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  }
  .tool-select-item svg{width:18px;height:18px;flex-shrink:0;stroke:var(--text-sub);transition:stroke var(--dur-fast) var(--ease);pointer-events:none;}
  .tool-select-item span{pointer-events:none;flex:1;min-width:0;}
  .tool-select-item:hover{background:var(--bg-alt);}
  .tool-select-item.selected{background:var(--accent-soft);color:var(--accent);}
  .tool-select-item.selected svg{stroke:var(--accent);}
  .tool-select-item .item-check{margin-left:auto;flex:0 0 auto;width:16px;height:16px;flex-shrink:0;stroke:var(--accent);opacity:0;transition:opacity var(--dur-fast) var(--ease);}
  .tool-select-item.selected .item-check{opacity:1;}

  /* card */
  .card{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    box-shadow:var(--shadow-sm);
    margin-bottom:14px;
    transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }

  /* re-triggered on tool switch / result render so content never just snaps in */
  @keyframes fadeUpIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .fade-in{animation:fadeUpIn var(--dur-slow) var(--ease) both;}

  /* current tool info */
  .tool-info{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;}
  .tool-info svg{flex-shrink:0;width:20px;height:20px;stroke:var(--accent);margin-top:2px;}
  .tool-info-text{min-width:0;}
  .tool-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tool-title-row h3{font-family:var(--font-display);font-size:16.5px;margin:0;font-weight:700;letter-spacing:-.01em;}
  .tool-tag{font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:2px 6px;}
  .tool-desc{font-size:12.5px;color:var(--text-sub);margin:3px 0 0;}

  input[type="file"]{
    width:100%;font-size:13px;color:var(--text-sub);
    border:1px dashed var(--border-strong);border-radius:var(--radius-sm);
    padding:10px;background:var(--bg-alt);cursor:pointer;
  }
  #file-preview-img{margin-top:10px;border-radius:var(--radius-sm);border:1px solid var(--border);display:block;}

  .btn-submit{
    width:100%;
    margin-top:16px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:var(--radius-sm);
    padding:12px 16px;
    font-family:var(--font-display);
    font-size:14.5px;
    font-weight:700;
    letter-spacing:-.01em;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    min-height:44px;
  }
  .btn-submit:hover{background:var(--accent-hover);}
  .btn-submit:active{transform:scale(.98);}

  /* result */
  #result-container .card{margin-bottom:14px;}
  .preview-img,.preview-media-box img,.preview-media-box video{
    width:100%;display:block;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-alt);
  }
  .preview-media-box{border-radius:var(--radius-sm);overflow:hidden;margin-bottom:12px;}
  .preview-media-box audio{display:block;}

  .action-btn{
    display:block;text-align:center;text-decoration:none;
    margin-top:10px;background:var(--text);color:#fff;
    border:none;border-radius:var(--radius-sm);padding:10px 14px;
    font-size:13.5px;font-weight:600;cursor:pointer;min-height:40px;line-height:20px;
  }
  .action-btn:hover{background:#000;}

  .custom-input{width:100%;margin-top:6px;}

  .dl-profile-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .dl-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
  .dl-username{font-size:13.5px;font-weight:700;}
  .dl-title{font-size:12.5px;color:var(--text-sub);margin-top:1px;}

  .dl-stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  .dl-stat-box{text-align:center;background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 4px;}
  .dl-stat-num{font-size:13px;font-weight:700;}
  .dl-stat-label{font-size:10.5px;color:var(--text-sub);margin-top:2px;}

  .dl-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .dl-chip{font-size:11.5px;color:var(--text-sub);background:var(--bg-alt);border:1px solid var(--border);border-radius:20px;padding:4px 10px;}

  .dl-caption-box{background:var(--bg-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;}
  .dl-caption-label{font-size:10.5px;font-weight:700;color:var(--text-faint);letter-spacing:.04em;margin-bottom:4px;}
  .dl-caption-text{font-size:13px;color:var(--text);white-space:pre-wrap;word-break:break-word;}
  .dl-copy-btn{margin-top:8px;background:none;border:1px solid var(--border-strong);border-radius:6px;padding:7px 12px;font-size:12px;color:var(--text-sub);cursor:pointer;min-height:32px;}
  .dl-copy-btn:hover{border-color:var(--accent);color:var(--accent);}

  .dl-format-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);font-weight:700;letter-spacing:.03em;margin-bottom:6px;}
  .dl-format-row{
    display:flex;align-items:center;gap:10px;padding:10px;
    border:1px solid var(--border);border-radius:var(--radius-sm);
    margin-bottom:8px;cursor:pointer;transition:border-color .15s ease, background .15s ease;
  }
  .dl-format-row:hover{border-color:var(--text-faint);}
  .dl-format-row.selected{border-color:var(--accent);background:var(--accent-soft);}
  .dl-format-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0;}
  .dl-format-info{min-width:0;flex:1;}
  .dl-format-name{font-size:13px;font-weight:600;}
  .dl-format-sub{font-size:11.5px;color:var(--text-sub);}
  .dl-format-check{color:var(--accent);font-weight:700;width:16px;text-align:center;flex-shrink:0;}
  .dl-quality-btn{
    width:100%;margin-top:-4px;margin-bottom:8px;border:none;color:#fff;
    border-radius:var(--radius-sm);padding:9px;font-size:13px;font-weight:600;cursor:pointer;min-height:40px;
  }

  .dl-tabs-row{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--border);}
  .format-tab{font-size:13px;color:var(--text-sub);padding:8px 4px;cursor:pointer;border-bottom:2px solid transparent;font-weight:600;}
  .format-tab.active{color:var(--text);border-bottom-color:var(--accent);}

  /* history */
  #dl-history-container{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;}
  .dl-history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .dl-history-title{font-size:12px;font-weight:700;color:var(--text-sub);letter-spacing:.03em;}
  .dl-history-clear{font-size:11.5px;color:var(--text-faint);cursor:pointer;padding:6px 4px;margin:-6px -4px;}
  .dl-history-clear:hover{color:var(--accent-bright);}
  .dl-history-empty{font-size:12.5px;color:var(--text-faint);padding:6px 0;}
  .dl-history-item{
    display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);
    padding:7px 0;border-bottom:1px solid var(--border);
  }
  .dl-history-item:last-child{border-bottom:none;}
  .dl-history-item img{width:34px;height:34px;border-radius:6px;object-fit:cover;flex-shrink:0;background:var(--bg-alt);}
  .h-name{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:22px;
    transform:translate(-50%,12px);opacity:0;pointer-events:none;
    background:var(--text);color:var(--bg);font-size:13px;
    padding:10px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);
    z-index:90;max-width:calc(100% - 32px);text-align:center;
    transition:transform var(--dur) var(--ease-spring), opacity var(--dur) var(--ease);
  }
  #toast.show{transform:translate(-50%,0);opacity:1;}

  /* footer */
  .site-footer{text-align:center;margin-top:28px;font-size:11.5px;color:var(--text-faint);}

  @media (min-width:680px){

    function fmtNum(n) {
      n = Number(n) || 0;
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return String(n);
    }
    function fmtSize(bytes) {
      if (!bytes) return '';
      const mb = bytes / (1024 * 1024);
      return mb.toFixed(1) + ' MB';
    }
    function fmtDuration(sec) {
      sec = Number(sec) || 0;
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}m ${s}s`;
    }

    async function downloadYoutube(type, quality, btnEl) {
      if (!ytInfo) return;
      const originalText = btnEl.innerText;
      btnEl.innerText = '⏳ Memproses...';
      try {
        const fetchUrl = type === 'video'
          ? `https://api.nexray.eu.cc/downloader/ytmp4?resolusi=${quality}&url=${encodeURIComponent(ytInfo.url)}`
          : `https://api.nexray.eu.cc/downloader/ytmp3?url=${encodeURIComponent(ytInfo.url)}`;
        const res = await fetch(fetchUrl);
        const json = await res.json();
        if (json.status === false || json.error) throw new Error(json.error || 'Gagal mengunduh media.');
        const downloadUrl = json.result || json.url || json.link || (json.data && json.data.url) || (json.data && json.data.downloadUrl);
        if (!downloadUrl) throw new Error('Link unduhan tidak ditemukan.');
        window.open(downloadUrl, '_blank');
        showToast('✅ Download dimulai!');
      } catch (err) {
        showToast('⚠️ ' + err.message);
      } finally {
        btnEl.innerText = originalText;
      }
    }

      resBox.style.display = 'block';
      playIn(resBox);
      resContent.innerHTML = '<div style="color:var(--text-sub); font-size:12px;">⏳ Mengambil media... Harap tunggu.</div>';
      try {
        if (!inputVal) throw new Error('URL input wajib diisi!');
        const targetUrl = `${tool.ep}?${tool.paramKey}=${encodeURIComponent(inputVal)}`;
        const res = await fetch(targetUrl);
        const json = await res.json();

        let mediaUrl = null;
        let title = null;
        if (Array.isArray(json.result) && json.result.length > 0) {
          mediaUrl = json.result[0].url || json.result[0].link;
          title = json.result[0].title || json.result[0].caption;
        } else if (Array.isArray(json.data) && json.data.length > 0) {
          mediaUrl = json.data[0].url || json.data[0].link || json.data[0];
          title = json.data[0].title || json.data[0].caption;
        } else {
          mediaUrl = json.result || json.url || json.link || (json.data && json.data.url) || (json.data && json.data.downloadUrl);
          title = json.title || json.caption || (json.data && json.data.title);
        }

        if (!mediaUrl || typeof mediaUrl !== 'string') {
          if (json.status === false || json.error) throw new Error(json.error || json.message || 'Gagal mengekstrak media dari URL.');
          throw new Error('Gagal mendapatkan URL media dari respon API.');
        }

        const isVideo = /\.(mp4|mov|webm)(\?|$)/i.test(mediaUrl) || tool.id === 'ig';
        const isAudio = !isVideo && (/\.(mp3|wav|m4a)(\?|$)/i.test(mediaUrl) || tool.id === 'spotify');

        let mediaPreview = '';
        if (isVideo) mediaPreview = `<div class="preview-media-box"><video src="${mediaUrl}" controls playsinline></video></div>`;
        else if (isAudio) mediaPreview = `<div class="preview-media-box" style="padding:16px;"><audio src="${mediaUrl}" controls style="width:100%;"></audio></div>`;
        else if (tool.id === 'terabox') mediaPreview = `<div class="dl-format-row" style="cursor:default; margin-bottom:10px;"><div class="dl-format-icon">📦</div><div class="dl-format-info"><div class="dl-format-name">File Terabox</div><div class="dl-format-sub">Siap diunduh</div></div></div>`;
        else mediaPreview = `<div class="preview-media-box"><img src="${mediaUrl}" alt=""></div>`;

        resContent.innerHTML = `
          ${mediaPreview}
          ${title ? `<div class="dl-caption-box"><div class="dl-caption-label">JUDUL / CAPTION</div><div class="dl-caption-text">${title}</div></div>` : ''}
          <div class="dl-format-row" style="cursor:default;">
            <div class="dl-format-icon">${isVideo ? '🎬' : isAudio ? '🎵' : '📁'}</div>
            <div class="dl-format-info"><div class="dl-format-name">${tool.name} Media</div><div class="dl-format-sub">${isVideo ? 'Video / Reels' : isAudio ? 'Audio File' : 'File'}</div></div>
          </div>
          <a href="${mediaUrl}" target="_blank" rel="noopener noreferrer" class="btn-submit" style="text-decoration:none; margin-top:2px;">⬇️ Simpan Media</a>
        `;
      } catch (err) {
        resContent.innerHTML = `<div style="color:var(--accent-bright); font-size:12px;">⚠️ Error: ${err.message}</div>`;
      }
    }

    async function processAction() {
      if (!currentTool) return;

      if (currentTool.type === 'tiktok') return previewTiktok();
      if (currentTool.type === 'json_url') return previewGenericMedia();
      if (currentTool.type === 'yt_combo') return fetchYoutubeInfo();

      const resBox = document.getElementById('result-container');
      const resContent = document.getElementById('result-content');
      const inputVal = document.getElementById('input-val').value.trim();

      resBox.style.display = 'block';
      playIn(resBox);
      resContent.innerHTML = '<div style="color:var(--text-sub); font-size:12px;">⏳ Sedang memproses... Harap tunggu.</div>';

      try {
        if (currentTool.type === 'brat_custom') {
          if (!inputVal) throw new Error('Masukkan teks untuk Brat!');
          const isAnimated = document.getElementById('brat-animated-select').value === 'true';
          const delay = document.getElementById('brat-delay').value || '500';
          
          let finalUrl = `${currentTool.ep}?text=${encodeURIComponent(inputVal)}`;
          if (isAnimated) {
            finalUrl += `&isAnimated=true&delay=${encodeURIComponent(delay)}`;
          }

          resContent.innerHTML = `
            <img src="${finalUrl}" class="preview-img" alt="Brat Result">
            <a href="${finalUrl}" target="_blank" class="action-btn" download>Unduh ${isAnimated ? 'GIF' : 'Gambar'}</a>
          `;
        }
        else if (currentTool.type === 'removebg_official') {
          if (!selectedImageFile) throw new Error('Pilih gambar dari galeri terlebih dahulu!');
          
          showToast('⚡ Menghapus background via Remove.bg...');
          const formData = new FormData();
          formData.append('image_file', selectedImageFile);
          formData.append('size', 'auto');

          const response = await fetch('https://api.remove.bg/v1.0/removebg', {
            method: 'POST',
            headers: {
              'X-Api-Key': CONFIG.removeBgApiKey
            },
            body: formData
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => null);
            const errDetail = errData && errData.errors ? errData.errors[0].title : 'Terjadi kesalahan pada server API.';
            throw new Error(errDetail);
          }

          const blob = await response.blob();
          const resultImgUrl = URL.createObjectURL(blob);

          resContent.innerHTML = `
            <img src="${resultImgUrl}" class="preview-img" alt="Result Remove BG">
            <a href="${resultImgUrl}" download="removebg-result.png" class="action-btn">Unduh Gambar (PNG)</a>
          `;
        }
        else if (currentTool.type === 'image_url') {
          if (!inputVal) throw new Error('Input teks wajib diisi!');
          const finalUrl = `${currentTool.ep}?${currentTool.paramKey}=${encodeURIComponent(inputVal)}`;
          resContent.innerHTML = `
            <img src="${finalUrl}" class="preview-img">
            <a href="${finalUrl}" target="_blank" class="action-btn">Simpan Gambar</a>
          `;
        }
        else if (currentTool.type === 'img2link') {
          if (!selectedImageFile) throw new Error('Pilih gambar terlebih dahulu!');
          const url = await uploadToImgBB(selectedImageFile);
          resContent.innerHTML = `
            <img src="${url}" class="preview-img">
            <input type="text" class="custom-input" value="${url}" readonly style="margin-top:6px; text-align:center;">
            <button class="action-btn" onclick="navigator.clipboard.writeText('${url}'); showToast('📋 Link tersalin!');">Salin Link</button>
          `;
        }
        else if (currentTool.type === 'gallery_upload') {
          if (!selectedImageFile) throw new Error('Pilih foto terlebih dahulu!');
          showToast(' Uploading gambar ke CDN...');
          const uploadedUrl = await uploadToImgBB(selectedImageFile);
          const finalApiUrl = `${currentTool.ep}?url=${encodeURIComponent(uploadedUrl)}`;
          
          resContent.innerHTML = `
            <img src="${finalApiUrl}" class="preview-img">
            <a href="${finalApiUrl}" target="_blank" class="action-btn">Unduh Hasilnya</a>
          `;
        }
        else if (currentTool.type === 'lobby_upload') {
          if (!inputVal) throw new Error('Nickname ML wajib diisi!');
          if (!selectedImageFile) throw new Error('Foto Avatar wajib dipilih!');
          showToast(' Uploading avatar...');
          const avatarUrl = await uploadToImgBB(selectedImageFile);
          const finalUrl = `${currentTool.ep}?nickname=${encodeURIComponent(inputVal)}&avatar=${encodeURIComponent(avatarUrl)}`;
          
          resContent.innerHTML = `
            <img src="${finalUrl}" class="preview-img">
            <a href="${finalUrl}" target="_blank" class="action-btn">Simpan Lobby ML</a>
          `;
        }
        else if (currentTool.type === 'fakedev') {
          const name = document.getElementById('fd-name').value.trim();
          const bio = document.getElementById('fd-bio').value.trim();
          if (!name || !bio) throw new Error('Nama & Bio wajib diisi!');
          if (!selectedImageFile) throw new Error('Pilih foto profil dev!');

          showToast(' Uploading foto profil...');
          const avatarUrl = await uploadToImgBB(selectedImageFile);
          const finalUrl = `${currentTool.ep}?nama=${encodeURIComponent(name)}&bio=${encodeURIComponent(bio)}&image=${encodeURIComponent(avatarUrl)}`;

          resContent.innerHTML = `
            <img src="${finalUrl}" class="preview-img">
            <a href="${finalUrl}" target="_blank" class="action-btn">Unduh Kartu Profil</a>
          `;
        }
      } catch (err) {
        resContent.innerHTML = `<div style="color:var(--accent-bright); font-size:12px;">⚠️ Error: ${err.message}</div>`;
      }
    }


    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (document.getElementById('feedback-modal').classList.contains('open')) closeFeedback();
      else if (document.getElementById('side-menu').classList.contains('open')) closeMenu();
      else if (document.getElementById('tool-select-panel').classList.contains('open')) closeToolMenu();
    });

    function initApp(){
      renderToolSelect();
      const el = document.getElementById('boot-loader');
      if (el) el.classList.add('hide');
    }
    // pakai DOMContentLoaded (bukan 'load') biar gak nunggu gambar eksternal
    // selesai dimuat -- itu penyebab layar sempat kosong/nyangkut sebelumnya.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
</script>
</body>
</html>
