<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NexaKit Pro</title>
    
    <!-- Google Fonts: Orbitron & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0b0512;
            --bg-card: rgba(22, 11, 36, 0.75);
            --bg-card-border: rgba(147, 51, 234, 0.3);
            --accent-purple: #9333ea;
            --accent-pink: #d946ef;
            --accent-light: #c084fc;
            --glow-color: rgba(168, 85, 247, 0.4);
            --text-white: #ffffff;
            --text-muted: #a1a1aa;
            --text-sub: #71717a;
            --font-head: 'Orbitron', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-body);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-main);
            min-height: 100vh;
            position: relative;
            padding-bottom: 30px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        /* Top Header Navigation Bar */
        .top-navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 5, 18, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }

        .menu-info {
            display: flex;
            flex-direction: column;
        }

        .menu-info .title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-white);
        }

        .menu-info .subtitle {
            font-size: 10px;
            color: var(--text-sub);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-player-pill {
            background: rgba(30, 15, 48, 0.8);
            border: 1px solid var(--bg-card-border);
            border-radius: 20px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }

        .equalizer span {
            width: 3px;
            background: var(--accent-pink);
            border-radius: 2px;
            animation: bounce 1s infinite ease-in-out;
        }

        .equalizer span:nth-child(1) { height: 60%; animation-delay: 0.1s; }
        .equalizer span:nth-child(2) { height: 100%; animation-delay: 0.3s; }
        .equalizer span:nth-child(3) { height: 40%; animation-delay: 0.2s; }

        @keyframes bounce {
            0%, 100% { transform: scaleY(0.4); }
            50% { transform: scaleY(1); }
        }

        .audio-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            cursor: pointer;
        }

        /* Hero Banner - Banner bawaan proyek dipertahankan */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 220px;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            align-items: flex-end;
            padding: 20px 16px;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(11, 5, 18, 0.2) 0%, rgba(11, 5, 18, 0.95) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-title {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-shadow: 0 0 10px rgba(147, 51, 234, 0.8);
        }

        .hero-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 2px;
            font-family: var(--font-head);
        }

        /* User Dynamic Status Card */
        .user-status-card {
            margin: -10px 16px 20px 16px;
            background: rgba(20, 10, 35, 0.8);
            border: 1px solid var(--bg-card-border);
            border-radius: 16px;
            padding: 14px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .user-info-grid {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar-box {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 15px var(--glow-color);
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-details {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            font-size: 11px;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
        }

        .detail-item i {
            color: var(--accent-light);
            width: 12px;
        }

        .detail-value {
            color: var(--text-white);
            font-weight: 600;
        }

        .status-online {
            color: #22c55e;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }

        .status-online::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 6px #22c55e;
        }

        .user-badges {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .battery-pill {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .battery-bar {
            width: 30px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .battery-fill {
            height: 100%;
            background: #22c55e;
        }

        .role-pill {
            background: rgba(147, 51, 234, 0.15);
            border: 1px solid rgba(147, 51, 234, 0.4);
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 11px;
            color: var(--accent-light);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .vvip-btn {
            margin-left: auto;
            background: linear-gradient(135deg, #7e22ce, #c084fc);
            border: none;
            border-radius: 12px;
            padding: 5px 12px;
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px var(--glow-color);
            cursor: pointer;
        }

        /* Category Filter Scroll Tabs */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 16px 16px 16px;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-tab {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .cat-tab.active {
            background: linear-gradient(135deg, var(--accent-purple), #6b21a8);
            color: #fff;
            border-color: var(--accent-light);
            box-shadow: 0 0 12px var(--glow-color);
        }

        .section-header {
            padding: 8px 16px 14px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-head);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .section-header i {
            color: var(--accent-light);
        }

        /* Real Dynamic Tools Grid Container */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 0 16px;
        }

        /* Modernized Styles for Existing Dynamic Cards */
        .tool-card, .card, .item-card {
            background: var(--bg-card) !important;
            border: 1px solid var(--bg-card-border) !important;
            border-radius: 14px !important;
            padding: 14px 10px !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            text-align: center !important;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tool-card:hover, .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-pink) !important;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.2) !important;
        }

        .tool-icon, .card-icon {
            font-size: 24px !important;
            margin-bottom: 10px !important;
            color: var(--accent-light) !important;
        }

        .tool-title, .card-title {
            font-size: 11px !important;
            font-weight: 700 !important;
            margin-bottom: 4px !important;
            color: var(--text-white) !important;
            line-height: 1.2 !important;
        }

        .tool-desc, .card-desc {
            font-size: 8px !important;
            color: var(--text-sub) !important;
            margin-bottom: 8px !important;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Subpage Styling Container */
        .subpage-container {
            display: none;
            padding: 16px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Header TopBar -->
        <header class="top-navbar">
            <div class="nav-left">
                <button class="icon-btn" id="btn-info"><i class="fa-solid fa-compass"></i></button>
                <div class="menu-info">
                    <span class="title">Menu Informasi</span>
                    <span class="subtitle">About Dev • Report Bug • Saluran WhatsApp</span>
                </div>
            </div>
            <div class="nav-right">
                <div class="audio-player-pill">
                    <div class="equalizer">
                        <span></span><span></span><span></span>
                    </div>
                    <button class="audio-btn" id="btn-audio-mute"><i class="fa-solid fa-volume-high"></i></button>
                    <button class="audio-btn" id="btn-audio-toggle"><i class="fa-solid fa-play"></i></button>
                    <button class="audio-btn" id="btn-audio-next"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <button class="icon-btn" id="btn-menu"><i class="fa-solid fa-bars"></i></button>
            </div>
        </header>

        <!-- Main Dashboard View -->
        <main id="main-content">
            <!-- Hero Banner asli web NexaKit Pro -->
            <div class="hero-banner" id="hero-banner" style="background-image: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1000&auto=format&fit=crop');">
                <div class="hero-content">
                    <div class="hero-title" id="app-title">
                        <i class="fa-solid fa-bolt" style="color: var(--accent-pink);"></i> NEXAKIT PRO
                    </div>
                    <div class="hero-subtitle" id="app-author">by shakz</div>
                </div>
            </div>

            <!-- Dynamic Real Device & User Info Status Card -->
            <div class="user-status-card">
                <div class="user-info-grid">
                    <div class="avatar-box" id="user-avatar-container">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="user-details">
                        <div class="detail-item">
                            <i class="fa-solid fa-globe"></i> NEGARA
                            <span class="detail-value" id="user-country">Detecting...</span>
                        </div>
                        <div class="detail-item">
                            <i class="fa-solid fa-mobile-screen"></i> DEVICE
                            <span class="detail-value" id="user-device">Detecting...</span>
                        </div>
                        <div class="detail-item">
                            <i class="fa-solid fa-window-maximize"></i> BROWSER
                            <span class="detail-value" id="user-browser">Detecting...</span>
                        </div>
                        <div class="detail-item">
                            <i class="fa-solid fa-chart-simple"></i> STATUS
                            <span class="status-online" id="user-status">Online</span>
                        </div>
                    </div>
                </div>

                <div class="user-badges">
                    <div class="battery-pill">
                        <i class="fa-solid fa-battery-half" id="battery-icon" style="color: #22c55e;"></i>
                        <div class="battery-bar">
                            <div class="battery-fill" id="battery-level" style="width: 50%;"></div>
                        </div>
                        <span id="battery-text">50%</span>
                    </div>

                    <div class="role-pill">
                        <i class="fa-solid fa-user-shield"></i> Role : <span id="user-role">member</span>
                    </div>

                    <button class="vvip-btn" id="btn-vvip">
                        <i class="fa-solid fa-crown"></i> VVIP <i class="fa-solid fa-arrow-up"></i>
                    </button>
                </div>
            </div>

            <!-- Category Filter Scroll Tabs -->
            <div class="category-scroll" id="category-tabs">
                <button class="cat-tab active" data-category="all"><i class="fa-solid fa-border-all"></i> All</button>
                <button class="cat-tab" data-category="downloader"><i class="fa-solid fa-download"></i> Downloader</button>
                <button class="cat-tab" data-category="maker"><i class="fa-solid fa-wand-magic-sparkles"></i> Maker</button>
                <button class="cat-tab" data-category="tools"><i class="fa-solid fa-gears"></i> Tools</button>
                <button class="cat-tab" data-category="utility"><i class="fa-solid fa-trash-can"></i> Utility</button>
            </div>

            <div class="section-header">
                <i class="fa-solid fa-border-all"></i> Semua Tools
            </div>

            <!-- Container Tempat JS Asli Proyek Render Daftar Tools -->
            <div class="tools-grid" id="tools-container">
                <!-- Diisi secara otomatis oleh JavaScript bawaan NexaKit Pro -->
            </div>
        </main>

        <!-- Dynamic Subpage Overlay (Untuk Fitur Detail / Download) -->
        <div id="subpage-view" class="subpage-container">
            <!-- Render otomatis oleh JS asli ketika menu diklik -->
        </div>

    </div>

    <!-- Panggil Script-Script Bawaan Proyek Asli Anda -->
    <script src="sw.js"></script>
    <script src="api/supabase-config.js"></script>
    <script>
        // Logika Deteksi Perangkat Real & Baterai Asli
        async function initRealSystemInfo() {
            // Browser & OS Detection
            const ua = navigator.userAgent;
            let device = "Desktop";
            if (/android/i.test(ua)) device = "Android";
            else if (/iPhone|iPad|iPod/i.test(ua)) device = "iOS";
            
            let browser = "Chrome";
            if (/firefox/i.test(ua)) browser = "Firefox";
            else if (/safari/i.test(ua) && !/chrome/i.test(ua)) browser = "Safari";

            const devElem = document.getElementById('user-device');
            const browElem = document.getElementById('user-browser');
            if(devElem) devElem.innerText = device;
            if(browElem) browElem.innerText = browser;

            // Real Battery API Status
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    const updateBattery = () => {
                        const level = Math.round(battery.level * 100);
                        const fillElem = document.getElementById('battery-level');
                        const textElem = document.getElementById('battery-text');
                        if (fillElem) fillElem.style.width = level + '%';
                        if (textElem) textElem.innerText = level + '%';
                    };
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                } catch(e) {}
            }

            // Real Country IP Detection
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const countryElem = document.getElementById('user-country');
                if (data && data.country_name && countryElem) {
                    countryElem.innerText = `🇮🇩 ${data.country_name}`;
                }
            } catch(e) {
                const countryElem = document.getElementById('user-country');
                if(countryElem) countryElem.innerText = "🇮🇩 Indonesia";
            }
        }

        window.addEventListener('DOMContentLoaded', initRealSystemInfo);
    </script>
</body>
</html>
